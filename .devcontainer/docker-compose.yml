services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../:/workspace:cached
    command: sleep infinity
    # 環境変数は backend/.env で管理（docker-compose.ymlでは設定しない）
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"    # Backend (FastAPI)
      - "3000:3000"    # Frontend

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: platinum
      POSTGRES_PASSWORD: platinum
      POSTGRES_DB: platinum_axe
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

volumes:
  postgres-data:
  redis-data:
